name: Build Windows PySide6 x64 executable

on:
  push:
    branches: [pyside6-x64-migration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pyside6-x64-migration
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Verify GUI architecture
        run: |
          python -c "import struct; assert struct.calcsize('P')*8 == 64; print('GUI Python: 64-bit')"

      - name: Install PySide6 GUI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.8.3 PyYAML==6.0.3 qtawesome==1.4.2 pyinstaller pytest pytest-qt pytest-xdist

      - name: Convert active Runner sources to direct PySide6 imports
        run: python scripts/migrate_runner_to_pyside6.py

      - name: Commit direct PySide6 conversion when needed
        shell: pwsh
        run: |
          git add runner main_runner.py app_icon.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Migrate active Runner sources directly to PySide6"
            git push origin HEAD:pyside6-x64-migration
          } else {
            Write-Host "Sources are already direct PySide6."
          }

      - name: Verify PyQt5 is not installed
        shell: pwsh
        run: |
          python -c "import importlib.util,sys; sys.exit(1 if importlib.util.find_spec('PyQt5') else 0)"

      - name: Run active Runner tests on PySide6
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
        run: |
          pytest runner/tests -q

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm PytestRunner.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = "dist\PytestRunner\PytestRunner.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found at $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()
          if ($process.HasExited) {
            throw "PytestRunner.exe exited on its own with code $($process.ExitCode)"
          }
          if ($process.MainWindowTitle -eq "Unhandled exception in script") {
            Stop-Process -Id $process.Id -Force
            throw "PytestRunner.exe displayed PyInstaller's unhandled exception dialog"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "PySide6 x64 executable started successfully."

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PytestRunner-PySide6-x64
          path: dist/PytestRunner/
          retention-days: 30
