name: Tests and Windows build

# Les tests tournent sur main, sur les branches de travail et sur les PR.
# L'executable n'est reconstruit que sur main : c'est la version livree.
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QT_API: pyside6

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.8.3 PyYAML==6.0.3 qtawesome==1.4.2 pytest pytest-qt pytest-xdist pytest-timeout

      # --timeout : un test bloque echoue avec son nom au lieu de figer le job.
      - name: Run Runner tests
        run: python -m pytest runner/tests -q -n auto --timeout=300 -p no:cacheprovider

  build:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.8.3 PyYAML==6.0.3 qtawesome==1.4.2 pyinstaller

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm PytestRunner.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = "dist\PytestRunner\PytestRunner.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found at $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()
          if ($process.HasExited) {
            throw "PytestRunner.exe exited on its own with code $($process.ExitCode)"
          }
          if ($process.MainWindowTitle -eq "Unhandled exception in script") {
            Stop-Process -Id $process.Id -Force
            throw "PytestRunner.exe displayed PyInstaller's unhandled exception dialog"
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PytestRunner-windows-${{ github.sha }}
          path: dist/PytestRunner/
          retention-days: 30
