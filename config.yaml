# Configuration du workspace lue par Pytest Runner.
#
# log_directory : dossier racine ou le conftest ecrit un fichier .log par test
# execute (dans un sous-dossier horodate par run). Chemin relatif au workspace,
# ou absolu. Defaut si absent : <workspace>/logs
log_directory: logs

# incremental_log:
#   false -> un dossier par lancement : date/Run_0042/reader/chemin/test.log
#   true  -> meme dossier pour un test repete, sans ecrasement :
#            date/reader/chemin/test_B0042_001.log
incremental_log: false

# python_executable : interpreteur Python utilise pour COLLECTER et EXECUTER les
# tests de ce workspace. Il est independant du Python qui fait tourner
# l'interface : celle-ci lance pytest en sous-processus, elle n'importe jamais le
# code teste. C'est ce qui permet de piloter depuis une interface 32 bits des
# tests qui ont besoin d'un Python 64 bits (DLL natives, par exemple).
#
# Cet interpreteur doit avoir pytest installe (et pytest-xdist pour l'option
# Parallel). Renseigne ici, il a priorite sur le reglage global de l'application
# (menu Configuration). Absent ou vide : le reglage global s'applique.
#
# python_executable: C:\Python313-64\python.exe
