[pytest]
python_files = test_*.py
addopts = -ra
markers =
    smoke: parcours minimal, a lancer avant tout le reste
    regression: rejoue un bug deja corrige
    slow: plus long que la moyenne de la suite
    critical: bloquant si en echec
    integration: plusieurs composants ensemble, pas juste une fonction
    demo: exemple pose pour explorer l'interface, sans valeur metier
